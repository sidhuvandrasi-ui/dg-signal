<!DOCTYPE html>
<html>
<head>
<title>DG SIGNAL - Premium App</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:
    radial-gradient(circle at top,#003b25,#050505 45%);
    color:white;
    text-align:center;
}

.container{
    padding:30px 20px;
}

.logo{
    font-size:45px;
    font-weight:900;
    letter-spacing:4px;
    color:#00ff88;
    text-shadow:0 0 20px #00ff88;
}

.subtitle{
    color:#aaa;
    margin-top:10px;
    font-size:18px;
}


.phone{
    width:250px;
    height:480px;
    margin:35px auto;
    background:#050505;
    border:6px solid #222;
    border-radius:45px;
    box-shadow:
    0 0 30px #00ff88,
    inset 0 0 30px #111;
    display:flex;
    align-items:center;
    justify-content:center;
}


.phone-screen{
    width:85%;
    height:90%;
    border-radius:35px;
    background:linear-gradient(#101010,#000);
    display:flex;
    align-items:center;
    justify-content:center;
}


.app-logo{
    font-size:32px;
    font-weight:bold;
    color:#00ff88;
    text-shadow:0 0 15px #00ff88;
}


.card{
    background:rgba(255,255,255,0.08);
    padding:25px;
    border-radius:25px;
    max-width:360px;
    margin:auto;
    backdrop-filter:blur(10px);
}


.badge{
    display:inline-block;
    padding:8px 15px;
    margin:5px;
    border-radius:20px;
    border:1px solid #00ff88;
    color:#00ff88;
}


.btn{
    display:inline-block;
    margin-top:25px;
    padding:16px 45px;
    border-radius:50px;
    background:#00ff88;
    color:#000;
    font-weight:bold;
    text-decoration:none;
    font-size:18px;
    box-shadow:0 0 25px #00ff88;
}


.red-btn{
    display:inline-block;
    margin-top:25px;
    padding:16px 45px;
    border-radius:50px;
    background:#ff0033;
    color:white;
    font-weight:bold;
    text-decoration:none;
    font-size:18px;
    box-shadow:0 0 25px #ff0033;
}


.feature{
    margin:15px;
    color:#ddd;
}


.footer{
    margin-top:40px;
    color:#777;
}

</style>

</head>


<body>

<div class="container">


<div class="logo">
DG SIGNAL
</div>

<div class="subtitle">
Premium Smart Signal Experience
</div>



<a class="btn" href="#">
DOWNLOAD APK
</a>



<div class="phone">

<div class="phone-screen">

<div class="app-logo">
DG<br>SIGNAL
</div>

</div>

</div>



<div class="card">

<span class="badge">PREMIUM</span>
<span class="badge">FAST</span>
<span class="badge">SECURE</span>


<div class="feature">
⚡ Instant Access
</div>

<div class="feature">
🚀 Advanced Experience
</div>

<div class="feature">
💎 Premium Design
</div>



<a class="red-btn" href="#">
DOWNLOAD APK
</a>


</div>



<div class="footer">
© 2026 DG SIGNAL
</div>


</div>

</body>
</html>
