    padding:30px 20px;

    font-size:42px;

    background:#00ff88;
    color:#000;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    border-radius:50px;
    box-shadow:0 0 20px #00ff88;
}

.badge{
    display:inline-block;
    background:#111;
    border:1px solid #00ff88;
    padding:8px 15px;
    border-radius:20px;
