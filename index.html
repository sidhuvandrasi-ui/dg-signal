<!DOCTYPE html>
<html>
<head>

<title>DG SIGNAL - AI Premium App</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#020202;
color:white;
text-align:center;
overflow-x:hidden;
}


body:before{
content:"";
position:fixed;
width:300px;
height:300px;
background:#00ff88;
filter:blur(150px);
opacity:.25;
top:-100px;
left:-100px;
z-index:-1;
}


.container{
padding:25px;
}


.logo{
font-size:55px;
font-weight:900;
letter-spacing:6px;
color:#00ff88;
text-shadow:
0 0 10px #00ff88,
0 0 30px #00ff88;
}


.tag{
margin-top:10px;
color:#aaa;
font-size:18px;
}


.btn{
display:block;
max-width:320px;
margin:25px auto;
padding:18px;
border-radius:50px;
font-size:19px;
font-weight:bold;
text-decoration:none;
}


.red{
background:#ff1744;
color:white;
box-shadow:0 0 35px #ff1744;
}


.green{
background:#00ff88;
color:#000;
box-shadow:0 0 35px #00ff88;
}



.phone{
width:260px;
height:520px;
margin:40px auto;
background:#050505;
border:5px solid #222;
border-radius:45px;
padding:15px;
box-shadow:
0 0 40px #00ff88;
}


.screen{
height:100%;
border-radius:35px;
background:
linear-gradient(160deg,#111,#000);
display:flex;
align-items:center;
justify-content:center;
}


.app{
font-size:40px;
font-weight:900;
color:#00ff88;
text-shadow:0 0 20px #00ff88;
}



.card{
max-width:380px;
margin:auto;
padding:25px;
background:rgba(255,255,255,.06);
border-radius:30px;
border:1px solid rgba(0,255,136,.3);
backdrop-filter:blur(15px);
}


.title{
font-size:28px;
font-weight:bold;
}


.desc{
color:#aaa;
line-height:1.5;
margin:15px;
}



.box{
background:#080808;
border-radius:20px;
padding:18px;
margin:12px;
border:1px solid #222;
}


.badge{
display:inline-block;
padding:8px 15px;
border-radius:20px;
color:#00ff88;
border:1px solid #00ff88;
margin:5px;
}



.footer{
margin-top:40px;
color:#666;
}

</style>

</head>


<body>


<div class="container">


<div class="logo">
DG SIGNAL
</div>


<div class="tag">
AI Powered Premium Signal Experience
</div>



<!-- TOP BUTTON -->

<a class="btn red" href="#">
DOWNLOAD APK
</a>



<div class="phone">

<div class="screen">

<div class="app">
DG<br>
SIGNAL
</div>

</div>

</div>



<div class="card">


<div class="title">
Premium Access
</div>


<div class="desc">
Experience next generation smart technology with a modern interface.
</div>


<span class="badge">AI POWERED</span>
<span class="badge">FAST</span>
<span class="badge">SECURE</span>



<div class="box">
⚡ Instant Signal System
</div>


<div class="box">
🚀 Modern Dashboard
</div>


<div class="box">
💎 Premium Experience
</div>



<!-- BOTTOM BUTTON -->

<a class="btn green" href="#">
DOWNLOAD APK
</a>


</div>



<div class="footer">
© 2026 DG SIGNAL
</div>


</div>


</body>
</html>
